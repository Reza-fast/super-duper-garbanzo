<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Atefe, a little question 💌</title>
  <meta name="description" content="Someone has a very important question for you 🌸" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink-50: #fff0f6;
      --pink-100: #ffdeeb;
      --pink-200: #fcc2d7;
      --pink-300: #faa2c1;
      --pink-400: #f783ac;
      --pink-500: #f06595;
      --pink-600: #e64980;
      --pink-700: #d6336c;
      --ink: #7a1f45;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Fredoka", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, var(--pink-50) 0%, var(--pink-100) 50%, var(--pink-200) 100%);
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    /* floating background hearts */
    .bg-hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .bg-hearts span {
      position: absolute; bottom: -40px; opacity: .55;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
    }

    .card {
      position: relative; z-index: 1;
      width: min(440px, 100%);
      background: rgba(255, 255, 255, .78);
      backdrop-filter: blur(6px);
      border: 3px solid #fff;
      border-radius: 32px;
      box-shadow: 0 18px 50px rgba(214, 51, 108, .25);
      padding: 28px 22px 30px;
      text-align: center;
    }

    .screen { display: none; }
    .screen.active { display: block; animation: pop .45s cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .face {
      font-size: 96px; line-height: 1;
      display: inline-block;
      animation: bob 1.8s ease-in-out infinite;
      filter: drop-shadow(0 6px 10px rgba(214, 51, 108, .25));
      user-select: none;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-10px) rotate(4deg); }
    }
    .face.shake { animation: shake .4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px) rotate(-8deg); }
      75% { transform: translateX(10px) rotate(8deg); }
    }

    .hi {
      font-family: "Pacifico", cursive;
      color: var(--pink-600);
      font-size: 34px;
      margin: 14px 0 4px;
    }
    h1 {
      font-size: 24px; font-weight: 700;
      margin: 6px 0 4px; line-height: 1.3;
    }
    .date-pill {
      display: inline-block;
      background: var(--pink-500); color: #fff;
      font-weight: 600; font-size: 17px;
      padding: 6px 16px; border-radius: 999px;
      margin: 8px 0 4px;
      box-shadow: 0 4px 0 var(--pink-700);
    }
    .sub { font-size: 15px; opacity: .8; margin: 10px 0 0; min-height: 1.4em; }

    .buttons {
      margin-top: 22px;
      min-height: 120px;
      display: flex; flex-wrap: wrap;
      align-items: center; justify-content: center;
      gap: 14px;
    }
    button {
      font-family: inherit; font-weight: 700;
      border: none; cursor: pointer;
      border-radius: 999px;
      transition: font-size .3s ease, padding .3s ease, transform .15s ease, opacity .3s ease;
      white-space: nowrap;
    }
    button:active { transform: scale(.94); }
    #yes {
      background: var(--pink-500); color: #fff;
      font-size: 20px; padding: 12px 30px;
      box-shadow: 0 5px 0 var(--pink-700);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { filter: brightness(1.08); box-shadow: 0 5px 0 var(--pink-700), 0 0 0 8px rgba(240, 101, 149, .2); } }
    #no {
      background: #fff; color: var(--pink-600);
      font-size: 20px; padding: 12px 30px;
      border: 2px solid var(--pink-300);
    }

    /* yes screen */
    .big-love { font-size: 110px; display: inline-block; animation: heartbeat 1s ease-in-out infinite; }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } 45% { transform: scale(1.12); }
    }
    .yay { font-family: "Pacifico", cursive; color: var(--pink-600); font-size: 40px; margin: 10px 0 0; }
    .details {
      margin: 18px auto 0; padding: 14px 16px;
      background: var(--pink-50); border: 2px dashed var(--pink-300);
      border-radius: 20px; font-size: 17px; line-height: 1.6;
      max-width: 320px;
    }
    .details b { color: var(--pink-600); }
    .ps { font-size: 13px; opacity: .65; margin-top: 16px; }

    /* confetti */
    .confetti {
      position: fixed; top: -40px; z-index: 5; pointer-events: none;
      animation: fall linear forwards;
    }
    @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

    @media (max-width: 380px) {
      .face { font-size: 80px; }
      .hi { font-size: 28px; }
      h1 { font-size: 21px; }
    }
  </style>
</head>
<body>
  <div class="bg-hearts" id="bgHearts" aria-hidden="true"></div>

  <main class="card">
    <!-- Screen 1: the question -->
    <section class="screen active" id="ask">
      <div class="face" id="face">🥺</div>
      <div class="hi">Hi Atefe!</div>
      <h1>Will you go on a date with me?</h1>
      <div class="date-pill">📅 14 November 2026</div>
      <p class="sub" id="sub">think carefully… 👉👈</p>
      <div class="buttons">
        <button id="yes" type="button">Yes 💖</button>
        <button id="no" type="button">No</button>
      </div>
    </section>

    <!-- Screen 2: she said yes -->
    <section class="screen" id="yay">
      <div class="big-love">🥰</div>
      <div class="yay">Yaaay!!</div>
      <h1>I knew you'd say yes 💕</h1>
      <div class="details">
        It's a date!<br />
        <b>Saturday, 14 November 2026</b><br />
        Wear something comfy & bring your cutest smile 🌷
      </div>
      <p class="ps">(the No button never stood a chance 🤭)</p>
    </section>
  </main>

  <script>
    const yes = document.getElementById('yes');
    const no = document.getElementById('no');
    const face = document.getElementById('face');
    const sub = document.getElementById('sub');

    // What the No button says (and the face + hint) on each click
    const steps = [
      { no: 'Are you sure?',          face: '😳', sub: 'hmm… try again 🙈' },
      { no: 'Really sure??',          face: '😢', sub: 'my heart just cracked a little' },
      { no: 'Think again!',           face: '😭', sub: 'the yes button is right there 👀' },
      { no: 'Last chance…',           face: '🥹', sub: 'I’ll bring snacks 🍓🍫' },
      { no: 'Pretty please?',         face: '😿', sub: 'even the cat is sad now' },
      { no: 'You’re breaking my heart', face: '💔', sub: 'ok the yes button is getting big…' },
      { no: 'pls 🥺',                 face: '🫠', sub: 'I’m melting' },
      { no: 'no?',                    face: '🙏', sub: 'just press yes hehe' },
    ];

    let clicks = 0;
    let yesSize = 20;
    let noSize = 20;

    no.addEventListener('click', () => {
      const s = steps[Math.min(clicks, steps.length - 1)];
      clicks++;

      no.textContent = s.no;
      face.textContent = s.face;
      sub.textContent = s.sub;

      // restart shake animation
      face.classList.remove('shake');
      void face.offsetWidth;
      face.classList.add('shake');

      // Yes grows, but stays inside the screen (phones too)
      const maxYes = Math.min(window.innerWidth, 440) / 5.5;
      yesSize = Math.min(yesSize * 1.35, maxYes);
      yes.style.fontSize = yesSize + 'px';
      yes.style.padding = `${yesSize * 0.5}px ${yesSize * 1.2}px`;

      // No shrinks until it disappears
      noSize = Math.max(noSize * 0.8, 6);
      no.style.fontSize = noSize + 'px';
      no.style.padding = `${noSize * 0.5}px ${noSize}px`;

      if (clicks >= steps.length + 2) {
        no.style.opacity = '0';
        no.style.pointerEvents = 'none';
        setTimeout(() => (no.style.display = 'none'), 300);
        sub.textContent = 'oops, the No button ran away 🏃‍♂️💨';
      }
    });

    yes.addEventListener('click', () => {
      document.getElementById('ask').classList.remove('active');
      document.getElementById('yay').classList.add('active');
      burst();
      setInterval(burst, 2500);
    });

    // floating background hearts
    const bg = document.getElementById('bgHearts');
    const bgEmoji = ['💗', '💕', '🌸', '💖', '🎀', '💞'];
    for (let i = 0; i < 18; i++) {
      const h = document.createElement('span');
      h.textContent = bgEmoji[i % bgEmoji.length];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = 16 + Math.random() * 22 + 'px';
      h.style.animationDuration = 8 + Math.random() * 10 + 's';
      h.style.animationDelay = -Math.random() * 18 + 's';
      bg.appendChild(h);
    }

    // heart confetti
    function burst() {
      const pieces = ['💖', '💕', '🌸', '💘', '✨', '🎀', '💗'];
      for (let i = 0; i < 40; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.textContent = pieces[Math.floor(Math.random() * pieces.length)];
        c.style.left = Math.random() * 100 + 'vw';
        c.style.fontSize = 14 + Math.random() * 22 + 'px';
        c.style.animationDuration = 2.5 + Math.random() * 2.5 + 's';
        c.style.animationDelay = Math.random() * 0.6 + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 6000);
      }
    }
  </script>
</body>
</html>
